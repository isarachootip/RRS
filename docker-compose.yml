services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rrs
      POSTGRES_PASSWORD: rrs
      POSTGRES_DB: rrs
    ports: ["5433:5432"] # 5433 เพื่อไม่ชน PostgreSQL ที่ติดตั้งในเครื่อง
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrs"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
