name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rrs
          POSTGRES_PASSWORD: rrs
          POSTGRES_DB: rrs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rrs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://rrs:rrs@localhost:5432/rrs?schema=public
      TEST_DATABASE_URL: postgresql://rrs:rrs@localhost:5432/rrs_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0zMi1ieXRlcy1sb25nISE=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rrs
          POSTGRES_PASSWORD: rrs
          POSTGRES_DB: rrs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rrs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://rrs:rrs@localhost:5432/rrs?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0zMi1ieXRlcy1sb25nISE=
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rrs/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm turbo run build --filter=@rrs/api --filter=@rrs/web
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

