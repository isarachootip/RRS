name: Deploy Staging & Production

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging (on merge to main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_BACKOFFICE_DOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy & Migrate on Staging VPS via SSH
        if: ${{ secrets.STAGING_SSH_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" << 'EOF'
            set -euo pipefail
            cd /opt/rrs
            git fetch --all
            git checkout main
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          EOF

      - name: Smoke Test Staging /health
        if: ${{ vars.STAGING_API_DOMAIN != '' }}
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://${{ vars.STAGING_API_DOMAIN }}/health"; then
              echo "Staging health check passed!"
              exit 0
            fi
            sleep 4
          done
          exit 1

  deploy-production:
    name: Deploy to Production (on git tag v* with Environment Approval)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PROD_BACKOFFICE_DOMAIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup Production DB, Migrate & Deploy via SSH
        if: ${{ secrets.PROD_SSH_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" << 'EOF'
            set -euo pipefail
            cd /opt/rrs
            ./scripts/backup-db.sh
            git fetch --tags --all
            git checkout "${GITHUB_REF_NAME}"
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          EOF

      - name: Smoke Test Production /health
        if: ${{ vars.PROD_API_DOMAIN != '' }}
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://${{ vars.PROD_API_DOMAIN }}/health"; then
              echo "Production health check passed!"
              exit 0
            fi
            sleep 4
          done
          exit 1
